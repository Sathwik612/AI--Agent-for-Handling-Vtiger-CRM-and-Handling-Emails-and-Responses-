[project]
name = "email-agent"
version = "0.1.0"
description = "AI email + CRM assistant (Ohio OST / Texas STAAR) with draft-first approval workflow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "imapclient>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "aiosmtpd>=1.4",
    "cryptography>=42",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Requiring AUTH while not requiring TLS:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "I001", "F401"]
